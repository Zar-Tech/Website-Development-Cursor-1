<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Rate Zone Calculator | VitalTools</title>
    <meta
      name="description"
      content="Calculate heart rate training zones based on age and resting heart rate."
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="../index.html"><span class="brand-pill">VT</span> VitalTools</a>
        <nav class="nav-links">
          <a href="../index.html">Home</a>
          <a href="../disclaimer.html">Disclaimer</a>
          <a href="../privacy.html">Privacy</a>
        </nav>
        <div class="theme-switcher">
          <button class="theme-btn active" type="button" data-theme-value="mint" style="background:#0b8f78"></button>
          <button class="theme-btn" type="button" data-theme-value="sunrise" style="background:#c86b35"></button>
          <button class="theme-btn" type="button" data-theme-value="violet" style="background:#635bff"></button>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container tool-layout">
        <section class="panel">
          <h1>Heart Rate Zone Calculator</h1>
          <p>Estimate cardio training zones using the Karvonen method.</p>
          <form id="heartRateForm">
            <div class="form-grid">
              <div class="form-row">
                <label for="hrAge">Age (years)</label>
                <input id="hrAge" type="number" min="10" max="100" required />
              </div>
              <div class="form-row">
                <label for="hrResting">Resting heart rate (bpm)</label>
                <input id="hrResting" type="number" min="30" max="120" required />
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Calculate Heart Zones</button>
          </form>
          <div class="result-box" id="heartRateResult">
            Enter age and resting heart rate to estimate zones.
          </div>
        </section>

        <aside class="panel">
          <div class="ad-slot">Ad Slot (300x250)</div>
          <h3>Related Tools</h3>
          <ul class="list">
            <li><a href="tdee-calculator.html">TDEE Calculator</a></li>
            <li><a href="water-intake-calculator.html">Water Intake Calculator</a></li>
          </ul>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div><a href="../index.html">Back to Home</a></div>
        <div><small>Copyright <span id="year"></span> VitalTools.</small></div>
      </div>
    </footer>

    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/calculators.js"></script>
  </body>
</html>
